<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Takka's Terrific Trek</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'DSEG7';
  src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --void: #000000;
  --abyss: #000000;
  --glyph: #a0c8a0;
  --sigil: #2a7a3a;
  --flicker: #39ff14;
  --blood: #1a4a1a;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: var(--glyph);
  font-family: 'EB Garamond', serif;
  overflow: hidden;
  cursor: default;
  user-select: none;
}

/* ── BACKGROUND ── */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background: #000000;
}

/* Scan line overlay */
.scanlines {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* ── STAGE ── */
.stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  perspective: 1800px;
}

/* Wrapper holds book + nav buttons together */
.book-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
}

/* Book uses 3:2 aspect ratio to match 1536x1024 */
.book {
  position: relative;
  width: min(80vw, calc(min(70vh, 520px) * 1.5));
  height: min(70vh, 520px);
  transform-style: preserve-3d;
  aspect-ratio: 3 / 2;
  flex-shrink: 0;
}

/* ── PAGES ── */
.page {
  position: absolute;
  width: 100%; height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000);
  cursor: pointer;
}

.page.flipped {
  transform: rotateY(-180deg);
}

.page-front, .page-back {
  position: absolute;
  width: 100%; height: 100%;
  backface-visibility: hidden;
  overflow: hidden;
}

.page-front {
  background: #000;
  z-index: 1;
}

.page-back {
  background: #000;
  transform: rotateY(180deg);
}

.page-front img, .page-back img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}

.page { z-index: 1; }

/* ── MOBILE TAP ZONES (inside the book, over the pages) ── */
.tap-zone {
  display: none;
  position: absolute;
  top: 0; height: 100%;
  width: 35%;
  z-index: 60;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tap-zone.prev { left: 0; }
.tap-zone.next { right: 0; }
.tap-zone:active {
  background: rgba(57,255,20,0.04);
}

/* ── DESKTOP NAV BUTTONS ── */
.nav-btn {
  z-index: 50;
  width: 48px; height: 48px;
  background: transparent;
  border: 1px solid rgba(57,255,20,0.25);
  border-radius: 4px;
  color: var(--flicker);
  font-size: 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.6;
  transition: all 0.25s ease;
  flex-shrink: 0;
}
.nav-btn:hover {
  opacity: 1;
  border-color: var(--flicker);
  background: rgba(57,255,20,0.06);
  box-shadow: 0 0 20px rgba(57,255,20,0.15);
}
.nav-btn:active {
  transform: scale(0.95);
  background: rgba(57,255,20,0.1);
}

.nav-btn svg {
  width: 20px; height: 20px;
  stroke: var(--flicker);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── BOTTOM CONTROLS ── */
.controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  padding-bottom: 20px;
  background: linear-gradient(0deg, #000 40%, transparent);
}

.page-indicator {
  font-family: 'DSEG7', 'Share Tech Mono', monospace;
  font-size: 16px;
  letter-spacing: 4px;
  color: var(--flicker);
  opacity: 0.9;
  margin-bottom: 12px;
  text-shadow: 0 0 10px rgba(57,255,20,0.4);
}

.progress-track {
  width: min(80vw, 400px);
  height: 2px;
  background: rgba(57,255,20,0.1);
  position: relative;
  cursor: pointer;
  margin-bottom: 12px;
}

.progress-fill {
  position: absolute; top: 0; left: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--sigil), var(--flicker));
  transition: width 0.4s ease;
}

.progress-dot {
  position: absolute; top: 50%;
  width: 8px; height: 8px;
  background: var(--flicker);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: left 0.4s ease;
  box-shadow: 0 0 10px rgba(57,255,20,0.5);
}

.thumbnails {
  display: flex; gap: 3px;
  overflow-x: auto;
  max-width: 90vw;
  padding: 4px 0;
  scrollbar-width: none;
}
.thumbnails::-webkit-scrollbar { display: none; }

.thumb {
  flex-shrink: 0;
  width: 36px; height: 24px;
  border: 1px solid rgba(57,255,20,0.15);
  opacity: 0.4;
  cursor: pointer;
  transition: all 0.3s;
  overflow: hidden;
  background: #000;
}
.thumb:hover { opacity: 0.8; border-color: var(--sigil); }
.thumb.active {
  opacity: 1;
  border-color: var(--flicker);
  box-shadow: 0 0 8px rgba(57,255,20,0.3);
}
.thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ── AMBIENT PARTICLES ── */
.particles {
  position: fixed; inset: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--glyph);
  border-radius: 50%;
  opacity: 0;
  animation: float-up linear infinite;
}

@keyframes float-up {
  0% { opacity: 0; transform: translateY(100vh) scale(0); }
  10% { opacity: 0.3; }
  90% { opacity: 0.1; }
  100% { opacity: 0; transform: translateY(-10vh) scale(1); }
}

/* ── FULLSCREEN TOGGLE ── */
.fs-btn {
  position: fixed; top: 15px; right: 20px;
  z-index: 200;
  background: none; border: 1px solid rgba(57,255,20,0.2);
  color: #39ff14;
  font-family: 'DSEG7', 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  padding: 6px 12px;
  cursor: pointer;
  opacity: 0.8;
  transition: all 0.3s;
}
.fs-btn:hover {
  opacity: 1;
  border-color: var(--flicker);
  box-shadow: 0 0 15px rgba(57,255,20,0.15);
}

/* ── KEYBOARD HINT (desktop only) ── */
.key-hint {
  position: fixed; bottom: 8px; right: 15px;
  font-family: 'DSEG7', 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--sigil);
  opacity: 0.25;
  letter-spacing: 2px;
  z-index: 100;
}

/* ── PAGE TURN FLASH ── */
@keyframes page-flash {
  0% { box-shadow: inset 0 0 30px rgba(57,255,20,0.08); }
  100% { box-shadow: inset 0 0 0 transparent; }
}
.page.turning .page-front {
  animation: page-flash 0.4s ease-out;
}

/* ── MOBILE POPUP HINT ── */
.mobile-hint {
  display: flex;
  position: fixed; inset: 0;
  z-index: 20000;
  background: rgba(0,0,0,0.92);
  align-items: center; justify-content: center;
  flex-direction: column;
  gap: 24px;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.mobile-hint.visible {
  opacity: 1;
  pointer-events: auto;
}
.mobile-hint-icon {
  display: flex; gap: 30px; align-items: center;
}
.mobile-hint-icon .arrow-hint {
  font-size: 32px;
  color: var(--flicker);
  opacity: 0.6;
  animation: hint-pulse 1.5s ease-in-out infinite alternate;
}
.mobile-hint-icon .arrow-hint:first-child {
  animation-direction: alternate-reverse;
}
.mobile-hint-icon .page-icon {
  width: 60px; height: 40px;
  border: 1px solid rgba(57,255,20,0.4);
  border-radius: 3px;
}
@keyframes hint-pulse {
  0% { opacity: 0.3; transform: translateX(0); }
  100% { opacity: 1; transform: translateX(5px); }
}
.mobile-hint-text {
  font-family: 'DSEG7', 'Share Tech Mono', monospace;
  font-size: 13px;
  color: var(--flicker);
  text-align: center;
  letter-spacing: 2px;
  line-height: 1.8;
  text-shadow: 0 0 12px rgba(57,255,20,0.4);
}
.mobile-hint-dismiss {
  font-family: 'DSEG7', 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--flicker);
  background: none;
  border: 1px solid rgba(57,255,20,0.3);
  padding: 10px 28px;
  cursor: pointer;
  letter-spacing: 3px;
  opacity: 0.8;
  transition: all 0.3s;
  margin-top: 10px;
}
.mobile-hint-dismiss:active {
  background: rgba(57,255,20,0.1);
}

/* ══════════════════════════════════
   RESPONSIVE — MOBILE
   ══════════════════════════════════ */
@media (max-width: 768px) {
  .book {
    width: 96vw;
    height: calc(96vw / 1.5);
    max-height: 58vh;
    max-width: calc(58vh * 1.5);
  }

  .tap-zone { display: block; }
  .nav-btn { display: none; }
  .thumbnails { display: none; }
  .key-hint { display: none; }

  .page-indicator {
    font-size: 13px;
    letter-spacing: 3px;
  }

  .fs-btn {
    font-size: 8px;
    padding: 5px 10px;
    top: 10px; right: 10px;
  }

  .controls {
    padding-bottom: 15px;
  }

  .progress-track {
    width: 70vw;
  }
}

@media (max-width: 400px) {
  .book {
    width: 98vw;
    height: calc(98vw / 1.5);
    max-height: 55vh;
    max-width: calc(55vh * 1.5);
  }
  .page-indicator { font-size: 11px; }
  .mobile-hint-text { font-size: 11px; }
}

@media (min-width: 1200px) {
  .book {
    width: min(75vw, calc(min(75vh, 600px) * 1.5));
    height: min(75vh, 600px);
  }
  .nav-btn { width: 52px; height: 52px; }
  .nav-btn svg { width: 22px; height: 22px; }
  .book-wrapper { gap: 28px; }
}

@media (max-width: 768px) and (orientation: landscape) {
  .book {
    height: 78vh;
    width: calc(78vh * 1.5);
    max-width: 95vw;
    max-height: calc(95vw / 1.5);
  }
  .controls { padding-bottom: 6px; }
  .page-indicator { font-size: 11px; margin-bottom: 4px; }
  .progress-track { margin-bottom: 4px; }
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="scanlines"></div>
<div class="particles" id="particles"></div>

<!-- Mobile hint popup -->
<div class="mobile-hint" id="mobileHint">
  <div class="mobile-hint-icon">
    <div class="arrow-hint">◂</div>
    <div class="page-icon"></div>
    <div class="arrow-hint">▸</div>
  </div>
  <div class="mobile-hint-text" id="hintText">
    TAP ON THE SIDES<br>OF THE PAGES<br>TO TURN PAGES
  </div>
  <button class="mobile-hint-dismiss" id="dismissHint">OK</button>
</div>

<button class="fs-btn" onclick="toggleFS()">EXPAND</button>

<div class="stage">
  <div class="book-wrapper">
    <!-- Desktop nav: prev -->
    <button class="nav-btn prev-btn" onclick="prevPage()" aria-label="Previous page">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="book" id="book">
      <!-- Mobile tap zones -->
      <div class="tap-zone prev" id="tapPrev"></div>
      <div class="tap-zone next" id="tapNext"></div>
    </div>

    <!-- Desktop nav: next -->
    <button class="nav-btn next-btn" onclick="nextPage()" aria-label="Next page">
      <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
  </div>
</div>

<div class="controls">
  <div class="page-indicator" id="pageNum">01 / 31</div>
  <div class="progress-track" id="progressTrack" onclick="handleProgressClick(event)">
    <div class="progress-fill" id="progressFill"></div>
    <div class="progress-dot" id="progressDot"></div>
  </div>
  <div class="thumbnails" id="thumbs"></div>
</div>

<div class="key-hint">← → ARROWS · SPACE</div>

<script>
const TOTAL_PAGES = 31;
const IMAGE_PATH = './pages/';

let currentPage = 0;
let isAnimating = false;
const FLIP_DURATION = 800;
const book = document.getElementById('book');
const thumbsContainer = document.getElementById('thumbs');

// ── HINT POPUP (both desktop and mobile) ──
function isMobile() {
  return window.matchMedia('(max-width: 768px)').matches;
}

function showHint() {
  const hint = document.getElementById('mobileHint');
  const hintText = document.getElementById('hintText');
  if (isMobile()) {
    hintText.innerHTML = 'TAP ON THE SIDES<br>OF THE PAGES<br>TO TURN PAGES';
  } else {
    hintText.innerHTML = 'USE THE ARROWS<br>OR KEYBOARD ← →<br>TO TURN PAGES';
  }
  setTimeout(() => { hint.classList.add('visible'); }, 300);
}

document.getElementById('dismissHint').addEventListener('click', () => {
  const hint = document.getElementById('mobileHint');
  hint.classList.remove('visible');
});

document.getElementById('mobileHint').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('dismissHint').click();
  }
});

// ── MOBILE TAP ZONES ──
document.getElementById('tapPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevPage();
});
document.getElementById('tapNext').addEventListener('click', (e) => {
  e.stopPropagation();
  nextPage();
});

// ── BUILD PAGES ──
function buildBook() {
  for (let i = 0; i < TOTAL_PAGES; i++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.style.zIndex = TOTAL_PAGES - i;
    page.dataset.index = i;

    const front = document.createElement('div');
    front.className = 'page-front';
    const imgF = document.createElement('img');
    imgF.src = `${IMAGE_PATH}${i}.png`;
    imgF.alt = `Page ${i + 1}`;
    imgF.loading = i < 3 ? 'eager' : 'lazy';
    imgF.draggable = false;
    front.appendChild(imgF);

    const back = document.createElement('div');
    back.className = 'page-back';
    back.innerHTML = '<div style="width:100%;height:100%;background:#000;"></div>';

    page.appendChild(front);
    page.appendChild(back);
    book.appendChild(page);

    // Desktop only: click page to go forward
    page.addEventListener('click', (e) => {
      if (isMobile()) return;
      const idx = parseInt(page.dataset.index);
      if (idx === currentPage) nextPage();
    });

    // Thumbnail
    const thumb = document.createElement('div');
    thumb.className = 'thumb' + (i === 0 ? ' active' : '');
    thumb.dataset.index = i;
    const thumbImg = document.createElement('img');
    thumbImg.src = `${IMAGE_PATH}${i}.png`;
    thumbImg.loading = 'lazy';
    thumbImg.draggable = false;
    thumb.appendChild(thumbImg);
    thumb.addEventListener('click', () => goToPage(i));
    thumbsContainer.appendChild(thumb);
  }
}

function updateDisplay(flippingIdx) {
  const pages = document.querySelectorAll('.page');
  pages.forEach((p, i) => {
    if (i < currentPage) {
      p.classList.add('flipped');
      if (i === flippingIdx) {
        p.style.zIndex = TOTAL_PAGES + 1;
      } else {
        p.style.zIndex = i;
      }
    } else {
      p.classList.remove('flipped');
      p.style.zIndex = TOTAL_PAGES - i;
    }
  });

  document.getElementById('pageNum').textContent =
    `${String(currentPage + 1).padStart(2, '0')} / ${TOTAL_PAGES}`;

  const pct = (currentPage / (TOTAL_PAGES - 1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressDot').style.left = pct + '%';

  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === currentPage);
    if (i === currentPage) {
      t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
}

function nextPage() {
  if (currentPage < TOTAL_PAGES - 1 && !isAnimating) {
    isAnimating = true;
    const flippingIdx = currentPage;
    const page = document.querySelectorAll('.page')[flippingIdx];
    page.classList.add('turning');
    page.classList.add('flipped');
    page.style.zIndex = TOTAL_PAGES + 1;
    currentPage++;
    updateDisplay(flippingIdx);
    setTimeout(() => {
      page.classList.remove('turning');
      page.style.zIndex = flippingIdx;
      isAnimating = false;
    }, FLIP_DURATION);
  }
}

function prevPage() {
  if (currentPage > 0 && !isAnimating) {
    isAnimating = true;
    currentPage--;
    const page = document.querySelectorAll('.page')[currentPage];
    page.style.zIndex = TOTAL_PAGES + 1;
    updateDisplay();
    setTimeout(() => {
      page.style.zIndex = TOTAL_PAGES - currentPage;
      isAnimating = false;
    }, FLIP_DURATION);
  }
}

function goToPage(idx) {
  if (idx >= 0 && idx < TOTAL_PAGES && !isAnimating) {
    currentPage = idx;
    updateDisplay();
  }
}

function handleProgressClick(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const page = Math.round(pct * (TOTAL_PAGES - 1));
  goToPage(page);
}

// ── KEYBOARD ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  if (e.key === 'Home') { e.preventDefault(); goToPage(0); }
  if (e.key === 'End') { e.preventDefault(); goToPage(TOTAL_PAGES - 1); }
});

// ── TOUCH SWIPE (backup alongside tap zones) ──
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextPage();
    else prevPage();
  }
}, { passive: true });

// ── PARTICLES ──
function spawnParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (12 + Math.random() * 20) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
    container.appendChild(p);
  }
}

// ── FULLSCREEN ──
function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// ── INIT ──
buildBook();
spawnParticles();
updateDisplay();
showHint();
</script>

</body>
</html>
